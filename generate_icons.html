<!DOCTYPE html>
<html>
<head>
    <title>Icon Generator - wApp</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            margin-bottom: 20px;
        }
        .instructions {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        canvas {
            display: none;
        }
        .icons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .icon-item {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .icon-item img {
            max-width: 100%;
            border: 1px solid #ddd;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background: #0056b3;
        }
        .download-link {
            display: inline-block;
            margin-top: 10px;
            color: #007bff;
            text-decoration: none;
        }
        .download-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>wApp Icon Generator</h1>
    
    <div class="instructions">
        <h2>Instructions:</h2>
        <ol>
            <li>Click "Generate Icons" below</li>
            <li>Right-click each icon and "Save image as..."</li>
            <li>Save them to <code>/static/icons/</code> with the names shown</li>
        </ol>
        <button onclick="generateIcons()">Generate Icons</button>
    </div>

    <div id="iconsContainer" class="icons-grid"></div>

    <svg id="sourceSVG" style="display:none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <!-- Black background -->
        <rect width="512" height="512" fill="#000000"/>
        
        <!-- Planck constant symbol (ℏ) - h with bar -->
        <g fill="#FFFFFF">
            <!-- Vertical stem of h -->
            <rect x="156" y="100" width="48" height="312" rx="8"/>
            
            <!-- Top of h stem -->
            <rect x="156" y="100" width="48" height="48" rx="8"/>
            
            <!-- Curved bowl of h -->
            <path d="M 204 260 Q 204 220, 244 220 Q 284 220, 284 260 L 284 412 L 332 412 L 332 260 Q 332 192, 284 164 Q 244 140, 204 164 L 204 260 Z" />
            
            <!-- Horizontal bar through the h (this makes it ℏ) -->
            <rect x="120" y="200" width="240" height="32" rx="8"/>
        </g>
    </svg>

    <script>
        const sizes = [
            { size: 72, name: 'icon-72x72.png' },
            { size: 96, name: 'icon-96x96.png' },
            { size: 128, name: 'icon-128x128.png' },
            { size: 144, name: 'icon-144x144.png' },
            { size: 152, name: 'icon-152x152.png' },
            { size: 192, name: 'icon-192x192.png' },
            { size: 384, name: 'icon-384x384.png' },
            { size: 512, name: 'icon-512x512.png' },
            { size: 512, name: 'maskable-icon-512x512.png' }
        ];

        function generateIcons() {
            const container = document.getElementById('iconsContainer');
            container.innerHTML = '';

            const svg = document.getElementById('sourceSVG');
            const svgData = new XMLSerializer().serializeToString(svg);
            const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const svgUrl = URL.createObjectURL(svgBlob);

            sizes.forEach(({ size, name }) => {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    
                    ctx.drawImage(img, 0, 0, size, size);
                    
                    const iconItem = document.createElement('div');
                    iconItem.className = 'icon-item';
                    
                    const iconImg = document.createElement('img');
                    iconImg.src = canvas.toDataURL('image/png');
                    iconImg.alt = name;
                    
                    const label = document.createElement('div');
                    label.textContent = name;
                    label.style.marginTop = '10px';
                    label.style.fontSize = '12px';
                    label.style.fontWeight = 'bold';
                    
                    const downloadLink = document.createElement('a');
                    downloadLink.href = canvas.toDataURL('image/png');
                    downloadLink.download = name;
                    downloadLink.textContent = 'Download';
                    downloadLink.className = 'download-link';
                    
                    iconItem.appendChild(iconImg);
                    iconItem.appendChild(label);
                    iconItem.appendChild(document.createElement('br'));
                    iconItem.appendChild(downloadLink);
                    
                    container.appendChild(iconItem);
                };
                img.src = svgUrl;
            });
        }

        // Auto-generate on page load
        window.onload = function() {
            generateIcons();
        };
    </script>
</body>
</html>
