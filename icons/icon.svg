<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="black"/>
  
  <!-- Clip to create horizontal top/bottom edges -->
  <clipPath id="clip">
    <rect x="0" y="20" width="100" height="60"/>
  </clipPath>

  <!-- W shape -->
  <path
    d="M15 20
       L30 80
       L50 40
       L70 80
       L85 20"
    fill="none"
    stroke="white"
    stroke-width="10"
    stroke-linecap="butt"
    stroke-linejoin="miter"
    clip-path="url(#clip)"/>
  
  <!-- Flatten the middle arrow tip -->
  <rect x="43" y="28" width="14" height="8" fill="black"/>
</svg>